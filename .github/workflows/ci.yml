name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  pr-title:
    # PRs are squash-merged, so the PR title becomes the commit message (ADR-0002).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|style|revert)(\([a-z0-9][a-z0-9-]*\))?!?: [^ ].*$'
          if [[ ! $TITLE =~ $pattern ]] || (( ${#TITLE} > 72 )); then
            echo "PR title must be '<type>(<scope>): <description>' and at most 72 characters."
            echo "Got: $TITLE"
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eskanban
          POSTGRES_PASSWORD: eskanban
          POSTGRES_DB: eskanban_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eskanban"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      ESKANBAN_TEST_DATABASE_URL: postgresql+psycopg://eskanban:eskanban@localhost:5432/eskanban_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
